- defaults:
    link:
      relink: true
      create: true
      force: true

- create:
  - ~/dev/personal
  - ~/dev/work
  - ~/.config
  - ~/.local/bin

- link: {
  ~/.gitconfig: dotfiles/git/.gitconfig,
  ~/.tmux.conf: dotfiles/tmux/.tmux.conf,
  ~/.editorconfig: dotfiles/.editorconfig,
  ~/.config/nvim: dotfiles/nvim,
  ~/.ackrc: dotfiles/.ackrc,
}

- shell:
  - sudo apt install -y
    ack-grep
    apt-transport-https
    bat
    build-essential
    ca-certificates
    curl
    fd-find
    fzf
    git
    git-core
    git-doc
    git-man
    htop
    jq
    python3-dev
    python3-pip
    python3-venv
    ripgrep
    screen
    tmux
    vim
  - python3 -m pip install --user
    autopep8
    black
    flake8
    httpie
    pep8
    pgcli
    pylint
    pyright
    setuptools
    vanity
    virtualenv
    wheel
    climage