- defaults:
    link:
      relink: true
      create: true
      force: true

- create:
    - ~/dev/personal
    - ~/dev/work
    - ~/.config
    - ~/.local/bin
    - ~/.fonts

- link:
    ~/.gitconfig: dotfiles/git/.gitconfig
    ~/.tmux.conf: dotfiles/tmux/.tmux.conf
    ~/.editorconfig: dotfiles/.editorconfig
    ~/.config/nvim: dotfiles/nvim
    ~/.ackrc: dotfiles/.ackrc
    ~/.gitconfig_work: dotfiles/git/.gitconfig_work
    ~/.bash_aliases: dotfiles/bash/.bash_aliases
    ~/.bashrc:
        force: true
        create: true
        path: dotfiles/bash/.bashrc
    ~/.bash_personal: dotfiles/bash/.bash_personal
    ~/.fonts/firacode: fonts/firacode
    ~/.fonts/JetBrainsMono: fonts/JetBrainsMono

- shell:
    - sudo apt-get update && sudo apt-get upgrade -y
    - sudo apt-get install -y
      ack-grep apt-transport-https bat build-essential ca-certificates
      clang curl fd-find git git-core git-doc git-man
      htop jq python3-dev python3-pip python3-venv ripgrep screen
      tmux vim xclip
    - PROFILE=/dev/null bash -c 'curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash'
    - ./scripts/ubuntu/golang.sh
    - ./scripts/ubuntu/docker.sh
    - ./scripts/ubuntu/minikube.sh
    - ./scripts/ubuntu/kubectl.sh
    - ./scripts/ubuntu/nvim.sh
    - ./scripts/ubuntu/fzf.sh
    - ./scripts/ubuntu/rustup.sh
    - fc-cache -fv # TODO: add a .sh file to use this and the commands above
