- defaults:
    link:
      relink: true
      create: true
      force: true

- create:
  - ~/dev/personal
  - ~/dev/work
  - ~/.config
  - ~/.local/bin

- link: {
  ~/.gitconfig: dotfiles/git/.gitconfig,
  ~/.tmux.conf: dotfiles/tmux/.tmux.conf,
  ~/.editorconfig: dotfiles/.editorconfig,
  ~/.config/nvim: dotfiles/nvim,
  ~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1: dotfiles/powershell/user_profile.ps1,
  ~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json: dotfiles/win-terminal/settings.json,
  ~/.ackrc: dotfiles/.ackrc,
  ~/.emacs.d: dotfiles/.emacs.d,
}

- shell:
  - winget install --id Microsoft.Powershell --source winget --silent
  - winget install --id Git.Git -e --source winget --silent
  - Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
  - scoop install curl jq delta bat neovim gcc nvm less sudo ack ripgrep fd
  - Install-Module posh-git -Scope CurrentUser -Force
  - scoop install https://github.com/JanDeDobbeleer/oh-my-posh/releases/latest/download/oh-my-posh.json
  - Install-Module -Name Terminal-icons -Repository PSGallery -Force
  - python -m pip install --user
    autopep8
    black
    flake8
    httpie
    pep8
    pgcli
    pylint
    setuptools
    vanity
    virtualenv
    wheel
    climage
  - oh-my-posh font install --user JetBrainsMono