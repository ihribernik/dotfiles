- defaults:
    link:
      relink: true
      create: true
      force: true

- create:
  - ~/dev/personal
  - ~/dev/work
  - ~/.config
  - ~/.local/bin

- link: {
  ~/.gitconfig: dotfiles/git/.gitconfig,
  ~/.tmux.conf: dotfiles/tmux/.tmux.conf,
  ~/.editorconfig: dotfiles/.editorconfig,
  ~/.config/nvim: dotfiles/nvim,
  ~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1: dotfiles/powershell/user_profile.ps1,
  ~/AppData/Local/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json: dotfiles/win-terminal/settings.json,
  ~/.ackrc: dotfiles/.ackrc,
  ~/.emacs.d: dotfiles/.emacs.d,
  ~/.gitconfig_work: dotfiles/git/.gitconfig_work,
  ~/AppData/Roaming/Sublime Text 3/Packages/User: dotfiles/User/,
  ~/.wezterm.lua: dotfiles/.wezterm.lua,
}

- shell:
  - winget install --id Microsoft.Powershell --source winget --silent --ignore-warnings
  - winget install --id Git.Git -e --source winget --silent --ignore-warnings
  - winget install --id JanDeDobbeleer.OhMyPosh --source winget --silent --ignore-warnings
  - winget install --id Kubernetes.minikube --source winget --silent --ignore-warnings
  - winget install --id Microsoft.PowerToys --source winget --silent --ignore-warnings
  - winget install --id BurntSushi.ripgrep.MSVC --source winget --silent --ignore-warnings
  - winget install --id junegunn.fzf --source winget --silent --ignore-warnings
  - winget install --id GitHub.cli --source winget --silent --ignore-warnings
  - winget install --id dandavison.delta --source winget --silent --ignore-warnings
  - winget install --id sharkdp.bat --source winget --silent --ignore-warnings
  - winget install --id jqlang.jq --source winget --silent --ignore-warnings
  - winget install --id LLVM.LLVM --source winget --silent --ignore-warnings
  - winget install --id sharkdp.fd --source winget --silent --ignore-warnings
  - winget install --id wez.wezterm --source winget --silent --ignore-warnings
  - winget install --id Neovim.Neovim --source winget --silent --ignore-warnings
  - winget install --id Microsoft.DotNet.SDK.9 --source winget
  - Install-Module posh-git -Scope CurrentUser -Force
  - Install-Module PSFzf -Scope CurrentUser -Force
  - Install-Module -Name Terminal-icons -Repository PSGallery -Force